<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Selección de Color e Imagen con JS</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 30px;
        }

        .seccion {
            margin-bottom: 50px;
        }

        .controles {
            margin-bottom: 15px;
        }

        select, button {
            padding: 4px 8px;
            font-size: 14px;
        }

        button {
            margin-top: 10px;
            display: block;
            cursor: pointer;
        }

        #cuadroColor {
            width: 220px;
            height: 220px;
            border: 1px solid #ccc;
            background-color: transparent;
        }

        #cuadroImagen {
            width: 280px;
            height: 200px;
            border: 1px solid #ccc;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }

        #cuadroImagen img {
            max-width: 100%;
            max-height: 100%;
            object-fit: contain;
        }
    </style>
</head>
<body>

    <div class="seccion">
        <div class="controles">
            <label for="selectColor">Seleccione:</label>
            <select id="selectColor">
                <option value="yellow">Amarillo</option>
                <option value="blue">Azul</option>
                <option value="red">Rojo</option>
            </select>
            <button type="button" id="btnColor">Mostrar</button>
        </div>
        <div id="cuadroColor"></div>
    </div>

    <div class="seccion">
        <div class="controles">
            <label for="selectImagen">Seleccione:</label>
            <select id="selectImagen">
                <option value="carro">Carro</option>
                <option value="moto">Moto</option>
                <option value="bicicleta">Bicicleta</option>
            </select>
            <button type="button" id="btnImagen">Mostrar</button>
        </div>
        <div id="cuadroImagen"></div>
    </div>

    <script src="script.js"></script>
</body>
</html>
